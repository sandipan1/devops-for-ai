# Production overrides. Shared defaults remain in values.yaml.
environment: prod

web:
  replicas: 3
  image:
    tag: 18a86a9f4416694520dc9b3ab18a67f196611670
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

api:
  replicas: 2
  image:
    tag: 18a86a9f4416694520dc9b3ab18a67f196611670
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

crawler:
  replicas: 2
  image:
    tag: 18a86a9f4416694520dc9b3ab18a67f196611670
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

secrets:
  enabled: true
