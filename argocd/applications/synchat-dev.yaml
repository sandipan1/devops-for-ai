apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synchat-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sandipan1/devops-for-ai.git
    targetRevision: main
    path: charts/synchat
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: synchat-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
