{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.web.name }}
  labels:
    app: {{ .Values.web.name }}
    {{- include "synchat.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.web.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
{{- end }}
